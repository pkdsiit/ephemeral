{% extends "base.html" %}

{% block title %}Admin — Public Rooms{% endblock %}

{% block content %}
<div style="max-width:800px; margin:0 auto;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
    <div>
      <a href="{{ url_for('admin.dashboard') }}" style="font-size:0.85rem; color:var(--text-muted);">← Admin Dashboard</a>
      <h1 style="font-size:1.8rem; font-weight:700; margin-top:0.25rem;">Manage Public Chat Rooms</h1>
    </div>
  </div>

  <!-- Create Room Card -->
  <div class="card" style="margin-bottom:2rem;">
    <h3 style="font-size:1.15rem; font-weight:600; margin-bottom:1rem;">Create New Public Room</h3>
    <form method="POST" action="{{ url_for('admin.rooms_management') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid-2" style="gap:1rem;">
        <div class="form-group">
          <label class="form-label">Room Code (Slug)</label>
          <input type="text" name="code" class="form-control" placeholder="e.g. music-hub" required>
        </div>
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Music Lovers" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <input type="text" name="description" class="form-control" placeholder="Brief summary of room rules or topic...">
      </div>

      <button type="submit" class="btn btn-primary">Create Room</button>
    </form>
  </div>

  <!-- Existing Rooms -->
  <div class="card">
    <h3 class="card-title" style="margin-bottom:1rem;">Existing Rooms</h3>
    <div style="display:flex; flex-direction:column; gap:0.75rem;">
      {% for room in rooms %}
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; background:var(--bg-input); border-radius:var(--radius-md);">
          <div>
            <span style="font-weight:600; font-size:1rem;">#{{ room.code }} ({{ room.name }})</span>
            <p style="font-size:0.8rem; color:var(--text-muted);">{{ room.description }}</p>
          </div>
          <form method="POST" action="{{ url_for('admin.toggle_room', room_id=room.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-sm {% if room.is_active %}btn-secondary{% else %}btn-primary{% endif %}">
              {{ 'Active (Click to Disable)' if room.is_active else 'Disabled (Click to Enable)' }}
            </button>
          </form>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
