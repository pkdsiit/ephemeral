{% extends "base.html" %}

{% block title %}# {{ room.name }} — Public Square{% endblock %}

{% block content %}
<div class="chat-container">
  <div class="chat-main" style="width:100%;">
    <!-- Room Header -->
    <div class="chat-main-header">
      <div class="chat-header-user">
        <a href="{{ url_for('public_chat.index') }}" class="btn btn-sm btn-secondary" style="margin-right:0.4rem;">←</a>
        <div class="brand-icon" style="background:linear-gradient(135deg, var(--accent-cyan), var(--primary));">#</div>
        <div class="chat-header-details">
          <h3>{{ room.name }}</h3>
          <p>{{ room.description }}</p>
        </div>
      </div>
    </div>

    <!-- Public Notice Banner -->
    <div class="chat-retention-banner" style="background:rgba(6, 182, 212, 0.08); border-color:rgba(6, 182, 212, 0.2); color:#67e8f9;">
      <span>🌐 Public Room • Messages are visible to all members and expire in 7 days</span>
    </div>

    <!-- Messages Feed -->
    <div class="chat-messages" id="public-messages">
      <!-- Dynamically populated by public_chat.js -->
    </div>

    <!-- Message Input Bar -->
    <div class="chat-input-bar">
      <input type="text" id="public-input" class="chat-input" placeholder="Broadcast a message to #{{ room.name }}..." autocomplete="off">
      <button type="button" id="public-send-btn" class="btn btn-primary btn-round" title="Send">
        ➤
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/public_chat.js') }}?v=2.0"></script>
<script>
  const publicChatApp = new PublicChatApp({
    roomCode: "{{ room.code }}",
    currentUserId: "{{ current_user.id }}",
    isAdmin: {{ 'true' if current_user.is_admin else 'false' }}
  });
</script>
{% endblock %}
