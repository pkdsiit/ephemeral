{% extends "base.html" %}

{% block title %}Public Square Rooms{% endblock %}

{% block content %}
<div style="max-width:800px; margin:0 auto;">
  <div style="margin-bottom:1.5rem;">
    <h1 style="font-size:1.8rem; font-weight:700;">Public Square</h1>
    <p style="color:var(--text-muted); font-size:0.9rem;">Open discussion rooms for everyone on Ephemeral. Messages expire after 7 days.</p>
  </div>

  <div style="display:flex; flex-direction:column; gap:1rem;">
    {% for room in rooms %}
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;">
            <span style="color:var(--accent-cyan); font-weight:bold; font-size:1.1rem;">#</span>
            <h3 style="font-size:1.15rem; font-weight:600;">{{ room.name }}</h3>
          </div>
          <p style="color:var(--text-muted); font-size:0.9rem;">{{ room.description }}</p>
        </div>
        <a href="{{ url_for('public_chat.room_view', room_code=room.code) }}" class="btn btn-primary">
          Join Room
        </a>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
