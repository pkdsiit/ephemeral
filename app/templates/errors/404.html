{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="container-narrow" style="text-align:center; padding-top:4rem;">
  <div style="font-size:4rem; font-weight:800; color:var(--primary); margin-bottom:1rem;">404</div>
  <h2 style="margin-bottom:1rem;">Resource Not Found</h2>
  <p style="color:var(--text-muted); margin-bottom:2rem;">The page, user, or ephemeral content you requested has expired, been consumed, or does not exist.</p>
  <a href="{{ url_for('main.index') if not current_user.is_authenticated else url_for('main.dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
