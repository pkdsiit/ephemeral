{% extends "base.html" %}
{% block title %}403 — Forbidden{% endblock %}
{% block content %}
<div class="container-narrow" style="text-align:center; padding-top:4rem;">
  <div style="font-size:4rem; font-weight:800; color:var(--danger); margin-bottom:1rem;">403</div>
  <h2 style="margin-bottom:1rem;">Access Forbidden</h2>
  <p style="color:var(--text-muted); margin-bottom:2rem;">You do not have permission to access this private conversation, ephemeral media, or administrative view.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
