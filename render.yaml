services:
  - type: web
    name: ephemeral-chat
    env: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn --config gunicorn_config.py wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ephemeral-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MESSAGE_RETENTION_DAYS
        value: "7"

  - type: cron
    name: ephemeral-cleanup-cron
    env: python
    schedule: "0 */2 * * *"  # Every 2 hours
    buildCommand: pip install -r requirements.txt
    startCommand: flask cleanup-expired
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ephemeral-postgres
          property: connectionString

databases:
  - name: ephemeral-postgres
    databaseName: ephemeral_chat_db
    user: ephemeral_user
    plan: free
